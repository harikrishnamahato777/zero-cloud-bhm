name: Production CI/CD — Browser History Manager Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-jar
          path: target/*.jar

  docker-build-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t browser-history-manager-web:latest .

      - name: Run container
        run: docker run -d --name bhm -p 8082:8082 browser-history-manager-web:latest

      - name: Smoke test API
        run: |
          sleep 15
          curl -f http://localhost:8082/api/history/all

      - name: Save Docker image
        run: docker save browser-history-manager-web:latest -o bhm-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v6
        with:
          name: bhm-docker-image
          path: bhm-image.tar

  deploy-kind:
    name: Deploy to kind Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: bhm-docker-image

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Create kind cluster
        run: kind create cluster --name bhm-cluster --wait 60s

      - name: Load Docker image into kind
        run: |
          docker load -i bhm-image.tar
          kind load docker-image browser-history-manager-web:latest --name bhm-cluster

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for deployment
        run: kubectl rollout status deployment/bhm-app --timeout=180s

      - name: Verify Kubernetes deployment
        run: |
          kubectl get pods -o wide
          kubectl get services
          kubectl port-forward service/bhm-service 8082:80 &
          sleep 10
          curl -f http://localhost:8082/api/history/all

      - name: Cleanup kind cluster
        if: always()
        run: kind delete cluster --name bhm-cluster