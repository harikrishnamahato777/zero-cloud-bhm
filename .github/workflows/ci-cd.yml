name: Zero-Cloud CI/CD — Browser History Manager

# Triggers on every push or PR to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build → Test → Package
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Maven Build & JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 between runs

      - name: Compile with Maven
        run: mvn compile -q

      - name: Run JUnit 5 tests
        run: mvn test

      - name: Package fat JAR
        run: mvn package -DskipTests -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-history-manager-jar
          path: target/browser-history-manager.jar

  # ─────────────────────────────────────────────────────────────
  # Job 2: Docker Build (runs after Job 1 passes)
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test      # only runs if tests pass

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t browser-history-manager:latest .
          docker images browser-history-manager

      - name: Save Docker image as tar
        run: docker save browser-history-manager:latest -o bhm-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhm-docker-image
          path: bhm-image.tar

  # ─────────────────────────────────────────────────────────────
  # Job 3: Deploy to kind Kubernetes cluster
  # ─────────────────────────────────────────────────────────────
  deploy-kind:
    name: Deploy to kind Cluster
    runs-on: ubuntu-latest
    needs: docker-build        # only runs if Docker build passes

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Create kind cluster
        run: kind create cluster --name bhm-cluster --wait 60s

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: bhm-docker-image

      - name: Load Docker image into kind
        run: |
          docker load -i bhm-image.tar
          kind load docker-image browser-history-manager:latest --name bhm-cluster

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for pods to be ready
        run: kubectl rollout status deployment/bhm-app --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -o wide
          kubectl get services
          echo "✅ Browser History Manager deployed to kind cluster!"

      - name: Delete kind cluster (cleanup)
        if: always()
        run: kind delete cluster --name bhm-cluster
